<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Вход · Lily</title>
  <meta name="robots" content="noindex">

  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/images/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/variables.css?v=4">
  <link rel="stylesheet" href="/css/reset.css?v=3">
  <link rel="stylesheet" href="/css/layout.css?v=6">
  <link rel="stylesheet" href="/css/components.css?v=9">
  <link rel="stylesheet" href="/css/cabinet.css?v=9">
  <script src="/js/analytics.js?v=1" defer></script>
</head>
<body class="cab-body">
  <header class="cab-header">
    <a href="/" class="cab-logo">
      <img src="/assets/images/favicon.png" alt="">
      <span>LILY</span>
    </a>
    <a href="https://t.me/LilyLesik?text=%D0%9F%D1%80%D0%B8%D0%B2%D0%B5%D1%82%2C%20%D0%9B%D0%B8%D0%BB%D1%8F%21%20%D0%9D%D0%B5%20%D0%BF%D0%BE%D0%BB%D1%83%D1%87%D0%B0%D0%B5%D1%82%D1%81%D1%8F%20%D0%B2%D0%BE%D0%B9%D1%82%D0%B8%20%D0%B2%20%D0%BA%D0%B0%D0%B1%D0%B8%D0%BD%D0%B5%D1%82." target="_blank" rel="noopener" class="cab-help" data-i18n="help">Помощь</a>
  </header>

  <main class="cab-main">
    <!-- Шаг 1: email -->
    <section class="cab-card" data-step="email" aria-labelledby="email-title">
      <h1 class="cab-title" id="email-title" data-i18n="emailTitle">Вход в кабинет</h1>
      <p class="cab-text" data-i18n="emailText">Введи email, который указывала при покупке. Пришлём код, пароль не нужен.</p>

      <form class="cab-form" id="email-form" novalidate>
        <label class="cab-label" for="email" data-i18n="emailLabel">Email</label>
        <input class="cab-input" id="email" name="email" type="email" inputmode="email"
               autocomplete="email" autocapitalize="off" autocorrect="off" spellcheck="false" required
               aria-describedby="email-error">
        <p class="cab-error" id="email-error" role="alert" hidden></p>
        <div class="cab-turnstile" id="turnstile"></div>
        <button type="submit" class="btn-primary cab-submit" data-i18n="emailSubmit">Получить код</button>
      </form>
    </section>

    <!-- Шаг 2: код -->
    <section class="cab-card" data-step="code" aria-labelledby="code-title" hidden>
      <h1 class="cab-title" id="code-title" data-i18n="codeTitle">Код из письма</h1>
      <p class="cab-text"><span data-i18n="codeSentTo">Мы отправили код на</span> <strong class="cab-email" data-email></strong> <span data-i18n="codeSpam">Если письма нет, проверь «Спам» и «Промоакции».</span></p>

      <form class="cab-form" id="code-form" novalidate>
        <label class="cab-label" for="code" data-i18n="codeLabel">Код из 6 цифр</label>
        <input class="cab-input cab-input--code" id="code" name="code" type="text" inputmode="numeric"
               autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="000000" required
               aria-describedby="code-error">
        <p class="cab-error" id="code-error" role="alert" hidden></p>
        <button type="submit" class="btn-primary cab-submit" data-i18n="codeSubmit">Войти</button>
      </form>

      <div class="cab-links">
        <button type="button" class="cab-link" data-action="resend" disabled></button>
        <button type="button" class="cab-link" data-action="change-email" data-i18n="changeEmail">Другой email</button>
      </div>
    </section>

  </main>

  <script src="/js/login.js?v=6"></script>
</body>
</html>
