<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sign in · Lily</title>
  <meta name="robots" content="noindex">

  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/images/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/variables.css?v=4">
  <link rel="stylesheet" href="/css/reset.css?v=3">
  <link rel="stylesheet" href="/css/layout.css?v=6">
  <link rel="stylesheet" href="/css/components.css?v=10">
  <link rel="stylesheet" href="/css/cabinet.css?v=12">
  <script src="/js/analytics.js?v=1" defer></script>
</head>
<body class="cab-body">
  <header class="cab-header">
    <a href="/en/" class="cab-logo">
      <img src="/assets/images/favicon.png" alt="">
      <span>LILY</span>
    </a>
    <a href="https://t.me/LilyLesik?text=Hi%20Lily%21%20I%20can%27t%20sign%20in%20to%20my%20account." target="_blank" rel="noopener" class="cab-help" data-i18n="help">Help</a>
  </header>

  <main class="cab-main">
    <!-- Step 1: email -->
    <section class="cab-card" data-step="email" aria-labelledby="email-title">
      <h1 class="cab-title" id="email-title" data-i18n="emailTitle">Sign in to your account</h1>
      <p class="cab-text" data-i18n="emailText">Enter the email you used at checkout. We will send you a code, no password needed.</p>

      <form class="cab-form" id="email-form" novalidate>
        <label class="cab-label" for="email" data-i18n="emailLabel">Email</label>
        <input class="cab-input" id="email" name="email" type="email" inputmode="email"
               autocomplete="email" autocapitalize="off" autocorrect="off" spellcheck="false" required
               aria-describedby="email-error">
        <p class="cab-error" id="email-error" role="alert" hidden></p>
        <div class="cab-turnstile" id="turnstile"></div>
        <button type="submit" class="btn-primary cab-submit" data-i18n="emailSubmit">Get a code</button>
      </form>
    </section>

    <!-- Step 2: code -->
    <section class="cab-card" data-step="code" aria-labelledby="code-title" hidden>
      <h1 class="cab-title" id="code-title" data-i18n="codeTitle">Enter the code</h1>
      <p class="cab-text"><span data-i18n="codeSentTo">We sent a code to</span> <strong class="cab-email" data-email></strong> <span data-i18n="codeSpam">No email? Check your Spam and Promotions folders.</span></p>

      <form class="cab-form" id="code-form" novalidate>
        <label class="cab-label" for="code" data-i18n="codeLabel">6-digit code</label>
        <input class="cab-input cab-input--code" id="code" name="code" type="text" inputmode="numeric"
               autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="000000" required
               aria-describedby="code-error">
        <p class="cab-error" id="code-error" role="alert" hidden></p>
        <button type="submit" class="btn-primary cab-submit" data-i18n="codeSubmit">Sign in</button>
      </form>

      <div class="cab-links">
        <button type="button" class="cab-link" data-action="resend" disabled></button>
        <button type="button" class="cab-link" data-action="change-email" data-i18n="changeEmail">Different email</button>
      </div>
    </section>

  </main>

  <script src="/js/login.js?v=6"></script>
</body>
</html>
