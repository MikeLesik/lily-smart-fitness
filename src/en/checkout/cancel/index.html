<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Payment not completed · Lily</title>
  <meta name="robots" content="noindex">

  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/images/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/variables.css?v=3">
  <link rel="stylesheet" href="/css/reset.css?v=2">
  <link rel="stylesheet" href="/css/layout.css?v=3">
  <link rel="stylesheet" href="/css/components.css?v=4">
  <link rel="stylesheet" href="/css/cabinet.css?v=6">
  <link rel="stylesheet" href="/css/buy.css?v=2">
  <script src="/js/analytics.js?v=1" defer></script>
</head>
<body class="cab-body">
  <header class="cab-header">
    <a href="/en/" class="cab-logo">
      <img src="/assets/images/favicon.png" alt="">
      <span>LILY</span>
    </a>
    <a href="https://t.me/LilyLesik?text=Hi%20Lily%21%20I%20have%20a%20question%20about%20payment." target="_blank" rel="noopener" class="cab-help">Help</a>
  </header>

  <main class="cab-main">
    <section class="cab-card" aria-labelledby="title">
      <h1 class="cab-title" id="title">Payment not completed</h1>
      <p class="cab-text">You have not been charged. You can try again with another card, Apple Pay or Google Pay.</p>
      <div class="cab-actions">
        <a class="btn-primary" href="/en/" data-retry hidden>Try again</a>
        <a class="cab-secondary" href="/en/programs/">All programs</a>
      </div>
      <p class="cab-note">Payment not going through? Message Lily on <a href="https://t.me/LilyLesik?text=Hi%20Lily%21%20My%20payment%20is%20not%20going%20through." target="_blank" rel="noopener">Telegram</a>, she will help.</p>
    </section>
  </main>

  <script>
    // Retry the same program: js/buy.js picks up data-buy
    (function () {
      var scope = new URLSearchParams(location.search).get('scope');
      var btn = document.querySelector('[data-retry]');
      if (scope && /^[\w-]+$/.test(scope)) {
        btn.setAttribute('data-buy', scope);
        btn.hidden = false;
      }
    })();
  </script>
  <script src="/js/buy.js?v=4"></script>
</body>
</html>
