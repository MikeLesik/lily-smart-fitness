<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Доступ к курсу — Lily</title>
  <meta name="description" content="Спасибо за покупку. Ссылка на доступ к курсу.">
  <meta name="robots" content="noindex,follow">

  <meta property="og:type" content="website">
  <meta property="og:locale" content="ru_RU">

  <link rel="icon" type="image/png" sizes="32x32" href="../../../assets/images/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../../../assets/images/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../../../css/variables.css?v=3">
  <link rel="stylesheet" href="../../../css/reset.css?v=2">
  <link rel="stylesheet" href="../../../css/layout.css?v=2">
  <link rel="stylesheet" href="../../../css/components.css?v=2">
  <link rel="stylesheet" href="../../../css/animations.css?v=2">
  <link rel="stylesheet" href="../../../css/responsive.css?v=2">
  <link rel="stylesheet" href="../../../css/workouts.css?v=2">
</head>
<body>

  <nav class="nav scrolled" role="navigation" aria-label="Главная навигация">
    <a href="/" class="nav-logo">
      <img src="../../../assets/images/favicon.png" alt="" class="nav-logo-icon">
      <span>LILY</span>
    </a>
    <div class="nav-actions">
      <a href="/" class="lang-switch">На&nbsp;главную</a>
    </div>
  </nav>

  <section class="success-section">
    <div class="container">
      <div class="success-card" data-success-slug="spina" data-locale="ru">

        <div class="success-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>

        <h1 class="success-title" data-success-title>Спасибо! Курс твой навсегда.</h1>
        <p class="success-subtitle" data-success-subtitle>Доступ к курсу открыт. Сохрани ссылку — она также придёт на почту.</p>

        <!-- CTA подставляется JS из courses.js: для accessType=telegram —
             «Перейти в Telegram-канал», для accessType=kinescope —
             «Открыть плеер Kinescope». -->
        <a href="#"
           target="_blank" rel="noopener"
           class="btn-primary success-cta"
           data-success-cta
           data-analytics="course_access_click"
           data-analytics-slug="spina">Получить доступ</a>

        <p class="success-note">
          Ссылка также придёт письмом от&nbsp;провайдера оплаты в течение нескольких минут.
          Если письмо не пришло — проверь папку «Спам» или напиши Лиле:
          <a href="https://t.me/LilyLesik" target="_blank" rel="noopener" style="color:var(--olive);text-decoration:underline">@LilyLesik</a>.
        </p>

      </div>
    </div>
  </section>

  <script src="../../../js/courses.js?v=2"></script>
  <script src="../../../js/main.js?v=4"></script>

</body>
</html>
