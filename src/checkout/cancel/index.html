<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Оплата не завершена · Lily</title>
  <meta name="robots" content="noindex">

  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/images/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/variables.css?v=3">
  <link rel="stylesheet" href="/css/reset.css?v=2">
  <link rel="stylesheet" href="/css/layout.css?v=2">
  <link rel="stylesheet" href="/css/components.css?v=2">
  <link rel="stylesheet" href="/css/cabinet.css?v=5">
  <link rel="stylesheet" href="/css/buy.css?v=1">
</head>
<body class="cab-body">
  <header class="cab-header">
    <a href="/" class="cab-logo">
      <img src="/assets/images/favicon.png" alt="">
      <span>LILY</span>
    </a>
    <a href="https://t.me/LilyLesik?text=%D0%9F%D1%80%D0%B8%D0%B2%D0%B5%D1%82%2C%20%D0%9B%D0%B8%D0%BB%D1%8F%21%20%D0%92%D0%BE%D0%BF%D1%80%D0%BE%D1%81%20%D0%BF%D0%BE%20%D0%BE%D0%BF%D0%BB%D0%B0%D1%82%D0%B5." target="_blank" rel="noopener" class="cab-help">Помощь</a>
  </header>

  <main class="cab-main">
    <section class="cab-card" aria-labelledby="title">
      <h1 class="cab-title" id="title">Оплата не завершена</h1>
      <p class="cab-text">Деньги не списаны. Можно попробовать ещё раз: другой картой, через Apple Pay или Google Pay.</p>
      <div class="cab-actions">
        <a class="btn-primary" href="/" data-retry hidden>Попробовать ещё раз</a>
        <a class="cab-secondary" href="/#workouts">Все программы</a>
      </div>
      <p class="cab-note">Не получается оплатить? Напиши Лиле в <a href="https://t.me/LilyLesik" target="_blank" rel="noopener">Telegram</a>, она поможет.</p>
    </section>
  </main>

  <script>
    // Повтор покупки той же программы: data-buy подхватывает js/buy.js
    (function () {
      var scope = new URLSearchParams(location.search).get('scope');
      var btn = document.querySelector('[data-retry]');
      if (scope && /^[\w-]+$/.test(scope)) {
        btn.setAttribute('data-buy', scope);
        btn.hidden = false;
      }
    })();
  </script>
  <script src="/js/buy.js?v=1"></script>
</body>
</html>
